clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true

steps:
  build:
    image: ubuntu:22.04
    volumes:
      - /tmp/woodpecker-artifacts:/woodpecker/artifacts
    # CORRECTED SECTION: Use Map syntax (no dashes), just Key: Value
    environment:
      MANUAL_PLATFORM: ${PLATFORM}
      MANUAL_ARCH: ${ARCH}
      MANUAL_DEBUG: ${DEBUG}
      MANUAL_PGO: ${PGO}

    commands:
      - apt-get update && apt-get install -y curl git build-essential sudo python3-dev
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain 1.93.0 -y
      - . "$HOME/.cargo/env"
      - rustup target add x86_64-unknown-linux-gnu
      
      # Set Defaults
      - export TARGET=${MANUAL_PLATFORM:-linux}
      - export ARCH=${MANUAL_ARCH:-x86_64}
      - export DEBUG=${MANUAL_DEBUG:-true}
      - export PGO=${MANUAL_PGO:-false}
      
      # Quotes are important here to prevent YAML parsing errors
      - 'echo "Target: $TARGET"'
      - 'echo "Arch:   $ARCH"'
      
      - cd .github/bsys6
      - ./bsys6 prepare build package

      - mkdir -p /woodpecker/artifacts/${CI_BUILD_NUMBER}
      - cp *.tar.xz /woodpecker/artifacts/${CI_BUILD_NUMBER}/ || true
      - cp *.zip /woodpecker/artifacts/${CI_BUILD_NUMBER}/ || true

when:
  event: [ push, manual ]

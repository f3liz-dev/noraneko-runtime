[project]
name = "firefox-profileserver"
version = "1.0.0"
description = "Firefox profile server for PGO profiling"
requires-python = ">=3.10"
dependencies = [
    # Direct dependencies
    "mozcrash",
    "mozfile",
    "mozhttpd",
    "mozprofile",
    "mozrunner",
    # Transitive mozbase dependencies
    "mozlog",
    "moznetwork",
    "mozinfo",
    "mozdevice",
    "mozprocess",
    "mozterm",
    "mozsystemmonitor",
    # External PyPI dependencies
    "blessed==1.20.0",
    "distro==1.9.0",
    "psutil==5.9.4",
]

[project.scripts]
profileserver = "profileserver:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["profileserver.py"]

[tool.uv]
dev-dependencies = []

[tool.uv.sources]
# Direct dependencies
mozcrash = { path = "../../testing/mozbase/mozcrash", editable = true }
mozfile = { path = "../../testing/mozbase/mozfile", editable = true }
mozhttpd = { path = "../../testing/mozbase/mozhttpd", editable = true }
mozprofile = { path = "../../testing/mozbase/mozprofile", editable = true }
mozrunner = { path = "../../testing/mozbase/mozrunner", editable = true }
# Transitive mozbase dependencies
mozlog = { path = "../../testing/mozbase/mozlog", editable = true }
moznetwork = { path = "../../testing/mozbase/moznetwork", editable = true }
mozinfo = { path = "../../testing/mozbase/mozinfo", editable = true }
mozdevice = { path = "../../testing/mozbase/mozdevice", editable = true }
mozprocess = { path = "../../testing/mozbase/mozprocess", editable = true }
mozterm = { path = "../../python/mozterm", editable = true }
mozsystemmonitor = { path = "../../testing/mozbase/mozsystemmonitor", editable = true }

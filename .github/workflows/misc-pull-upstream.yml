---
# SPDX-License-Identifier: MPL-2.0

name: Pull Upstream

'on':
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '40 11 * * *'  # 8:40 PM UTC+9 (11:40 AM UTC)

permissions:
  contents: write
  pull-requests: write

jobs:
  pull-upstream-and-check-patches:
    name: Pull upstream changes and validate patches
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./noraneko_runtime

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: 'main'
          fetch-depth: 0
          path: noraneko_runtime

      - name: Get current version
        id: old_version
        run: |
          OLD_VERSION=$(cat browser/config/version.txt)
          echo "version=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $OLD_VERSION"

      - name: Clone upstream Firefox repository
        run: |
          git clone -b release --single-branch \
            https://github.com/mozilla-firefox/firefox \
            --depth 200 ../upstream_release

      - name: Find latest released commit and get upstream version
        id: new_version
        run: |
          cd ../upstream_release
          
          # The strategy: Firefox bumps the version immediately after release.
          # We want to find the last commit before a version bump occurred.
          # This is the actual release commit.
          
          echo "Searching for the latest released commit..."
          PREVIOUS_VERSION=""
          RELEASE_COMMIT=""
          LAST_COMMIT=""
          
          # Walk through commits from newest to oldest
          for commit in $(git log --format="%H" -n 200); do
            LAST_COMMIT="$commit"
            git checkout -q "$commit"
            CURRENT_VERSION=$(cat browser/config/version.txt 2>/dev/null || echo "")
            
            if [ -z "$CURRENT_VERSION" ]; then
              continue
            fi
            
            echo "Commit $commit: version $CURRENT_VERSION"
            
            # If we have a previous version and it's different from current,
            # it means the previous commit was right after a version bump
            # So the current commit is the one we want (before the bump)
            if [ -n "$PREVIOUS_VERSION" ] && [ "$PREVIOUS_VERSION" != "$CURRENT_VERSION" ]; then
              RELEASE_COMMIT="$commit"
              echo "Found release commit: $commit with version $CURRENT_VERSION"
              break
            fi
            
            PREVIOUS_VERSION="$CURRENT_VERSION"
          done
          
          # If we didn't find a version change, use the last commit we checked.
          # This happens when:
          # 1. All commits in the history have the same version (no version bump in 200 commits)
          # 2. We're already at a released commit and haven't seen a newer version yet
          # In both cases, using the oldest commit we checked is the safest choice.
          if [ -z "$RELEASE_COMMIT" ]; then
            if [ -n "$LAST_COMMIT" ]; then
              RELEASE_COMMIT="$LAST_COMMIT"
              echo "No version bump found in history, using last commit: $RELEASE_COMMIT"
            else
              # Fallback to HEAD if no commits were found (shouldn't happen with depth 200)
              RELEASE_COMMIT=$(git rev-parse HEAD)
              echo "No commits found in loop, using HEAD: $RELEASE_COMMIT"
            fi
          fi
          
          git checkout -q "$RELEASE_COMMIT"
          NEW_VERSION=$(cat browser/config/version.txt)
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "commit=$RELEASE_COMMIT" >> $GITHUB_OUTPUT
          echo "Using upstream version: $NEW_VERSION at commit $RELEASE_COMMIT"

      - name: Find latest release using tag parsing
        id: tag_version
        run: |
          echo "Searching for latest release by parsing tags..."
          
          # Get all Firefox release tags, excluding beta versions and ESR
          # Pattern: FIREFOX_<major>_<minor>_RELEASE or FIREFOX_<major>_<minor>_<patch>_RELEASE
          ALL_TAGS=$(git ls-remote --tags https://github.com/mozilla-firefox/firefox.git | \
            awk '{print $1 " " $2}' | \
            grep "RELEASE$" | \
            grep -E "FIREFOX_[0-9]+_[0-9]+(_[0-9]+)?_RELEASE$" | \
            grep -v "b[0-9]_RELEASE" | \
            grep -v "esr" | \
            sed 's|refs/tags/||')
          
          # Function to parse version from tag name
          parse_version() {
            local tag="$1"
            # FIREFOX_146_0_RELEASE -> 146.0.0
            # FIREFOX_146_0_1_RELEASE -> 146.0.1
            echo "$tag" | sed -E 's/FIREFOX_([0-9]+)_([0-9]+)(_([0-9]+))?_RELEASE/\1.\2.\4/' | sed 's/\.$/\.0/'
          }
          
          # Function to compare two version strings
          compare_versions() {
            local ver1="$1"
            local ver2="$2"
            
            IFS='.' read -r v1_major v1_minor v1_patch <<< "$ver1"
            IFS='.' read -r v2_major v2_minor v2_patch <<< "$ver2"
            
            v1_patch=${v1_patch:-0}
            v2_patch=${v2_patch:-0}
            
            if [ "$v1_major" -gt "$v2_major" ]; then echo "1"
            elif [ "$v1_major" -lt "$v2_major" ]; then echo "-1"
            elif [ "$v1_minor" -gt "$v2_minor" ]; then echo "1"
            elif [ "$v1_minor" -lt "$v2_minor" ]; then echo "-1"
            elif [ "$v1_patch" -gt "$v2_patch" ]; then echo "1"
            elif [ "$v1_patch" -lt "$v2_patch" ]; then echo "-1"
            else echo "0"
            fi
          }
          
          LATEST_TAG=""
          LATEST_VERSION=""
          LATEST_COMMIT=""
          
          # Find the latest version by comparing all tags
          while IFS=' ' read -r commit tag; do
            version=$(parse_version "$tag")
            
            if [ -z "$LATEST_VERSION" ]; then
              LATEST_TAG="$tag"
              LATEST_VERSION="$version"
              LATEST_COMMIT="$commit"
            else
              cmp_result=$(compare_versions "$version" "$LATEST_VERSION")
              if [ "$cmp_result" = "1" ]; then
                LATEST_TAG="$tag"
                LATEST_VERSION="$version"
                LATEST_COMMIT="$commit"
              fi
            fi
          done <<< "$ALL_TAGS"
          
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "commit=$LATEST_COMMIT" >> $GITHUB_OUTPUT
          echo "Found tag: $LATEST_TAG (version: $LATEST_VERSION, commit: $LATEST_COMMIT)"

      - name: Compare commit detection methods
        run: |
          COMMIT_METHOD_VERSION="${{ steps.new_version.outputs.version }}"
          COMMIT_METHOD_HASH="${{ steps.new_version.outputs.commit }}"
          TAG_METHOD_VERSION="${{ steps.tag_version.outputs.version }}"
          TAG_METHOD_TAG="${{ steps.tag_version.outputs.tag }}"
          TAG_METHOD_HASH="${{ steps.tag_version.outputs.commit }}"
          
          echo "================================"
          echo "Comparing Release Detection Methods"
          echo "================================"
          echo ""
          echo "Commit-walking method (current):"
          echo "  Version: $COMMIT_METHOD_VERSION"
          echo "  Commit:  $COMMIT_METHOD_HASH"
          echo ""
          echo "Tag-parsing method (new):"
          echo "  Tag:     $TAG_METHOD_TAG"
          echo "  Version: $TAG_METHOD_VERSION"
          echo "  Commit:  $TAG_METHOD_HASH"
          echo ""
          
          if [ "$COMMIT_METHOD_HASH" = "$TAG_METHOD_HASH" ]; then
            echo "✅ SUCCESS: Both methods found the same commit!"
            echo "Both methods agree on commit: $COMMIT_METHOD_HASH"
          else
            echo "❌ ERROR: Methods found different commits"
            echo "This indicates a mismatch between the two detection methods:"
            echo "  - Commit-walking method: $COMMIT_METHOD_HASH"
            echo "  - Tag-parsing method:    $TAG_METHOD_HASH"
            echo ""
            echo "Possible causes:"
            echo "  - Release tag hasn't been created yet for the latest version"
            echo "  - There's a delay between release branch update and tag creation"
            echo "  - One of the detection methods is incorrect"
            echo ""
            echo "The workflow must be fixed before continuing."
            exit 1
          fi

      - name: Compare versions
        id: version_diff
        run: |
          OLD_VERSION="${{ steps.old_version.outputs.version }}"
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          IFS='.' read -r OLD_MAJOR OLD_MINOR OLD_PATCH <<< "$OLD_VERSION"
          IFS='.' read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "$NEW_VERSION"

          if [ "$OLD_MAJOR" != "$NEW_MAJOR" ]; then
            echo "change_type=MAJOR" >> $GITHUB_OUTPUT
          elif [ "$OLD_MINOR" != "$NEW_MINOR" ]; then
            echo "change_type=MINOR" >> $GITHUB_OUTPUT
          elif [ "$OLD_PATCH" != "$NEW_PATCH" ]; then
            echo "change_type=PATCH" >> $GITHUB_OUTPUT
          else
            echo "change_type=PATCH" >> $GITHUB_OUTPUT
          fi

      - name: Check for existing PR
        id: check_pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main'
            });

            const syncPR = pulls.data.find(pr => 
              pr.title.match(/^sync: (MAJOR|MINOR|PATCH) upstream/) &&
              pr.user.login.includes('bot')
            );

            if (syncPR) {
              console.log(`Found existing PR #${syncPR.number}: ${syncPR.title}`);
              core.setOutput('exists', 'true');
              core.setOutput('number', syncPR.number);
              core.setOutput('branch', syncPR.head.ref);
            } else {
              console.log('No existing sync PR found');
              core.setOutput('exists', 'false');
            }

      - name: Checkout existing PR branch
        if: steps.check_pr.outputs.exists == 'true'
        run: |
          BRANCH_NAME="${{ steps.check_pr.outputs.branch }}"
          git config user.name "f3liz-bot[bot]"
          git config user.email "230694705+f3liz-bot@users.noreply.github.com"
          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"

      # 追いついている(overlay の base がもう新しい upstream commit)なら、rsync も merge もしない。
      # ここが無いと、同じ版の日にも overlay を merge し直して PR にコミットを積んでいた。
      - name: Check if already synced
        run: |
          BASE=$(cat .github/overlays/UPSTREAM_BASE 2>/dev/null || echo "")
          NEW="${{ steps.new_version.outputs.commit }}"
          if [ -n "$BASE" ] && [ "$BASE" = "$NEW" ]; then
            echo "Already synced to $NEW. Nothing to do."
            echo "UP_TO_DATE=true" >> $GITHUB_ENV
          fi

      - name: Sync upstream files
        if: env.UP_TO_DATE != 'true'
        run: |
          mv ../upstream_release/README.md ../upstream_release/MOZ_README.md
          rsync -a --delete \
            --exclude='.git' \
            --exclude='/.github/' \
            --exclude='/noraneko/' \
            --exclude='/.gitmodules' \
            --exclude='/README.md' \
            --exclude='/.woodpecker.ya?ml' \
            --exclude='/.woodpecker/' \
            ../upstream_release/ ./

      - name: 3-way merge overlays with new upstream
        id: overlay_merge
        if: env.UP_TO_DATE != 'true'
        run: |
          OVERLAY_DIR=".github/overlays"
          if [ ! -d "$OVERLAY_DIR" ]; then
            echo "No overlay directory found, skipping merge"
            echo "overlay_failed=false" >> $GITHUB_OUTPUT
            echo "overlay_conflicts=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          OLD_BASE=$(cat "$OVERLAY_DIR/UPSTREAM_BASE" 2>/dev/null || echo "")
          if [ -z "$OLD_BASE" ]; then
            echo "No UPSTREAM_BASE found. Overlays will be kept as-is."
            echo "overlay_failed=false" >> $GITHUB_OUTPUT
            echo "overlay_conflicts=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          HAS_CONFLICT=0
          CONFLICT_COUNT=0
          MERGED_COUNT=0
          DELETED_FILES=""
          OBSOLETE_FILES=""
          # JSON array of {file, content} for conflict comments
          echo '[]' > /tmp/conflicts.json

          # base(前回 sync した upstream commit)は upstream 側の repo にしか無い。
          # clone は release 枝の --depth 200 なので、届いていなければ SHA 指定で足す。
          # ここで取れないまま空の base で merge すると、全ファイルが丸ごと衝突する。
          UPSTREAM=../upstream_release
          if ! git -C "$UPSTREAM" cat-file -e "$OLD_BASE^{commit}" 2>/dev/null; then
            git -C "$UPSTREAM" fetch -q --depth=1 origin "$OLD_BASE"
          fi
          if ! git -C "$UPSTREAM" cat-file -e "$OLD_BASE^{commit}" 2>/dev/null; then
            echo "::error::UPSTREAM_BASE $OLD_BASE is not reachable in the upstream clone; refusing to merge overlays without a base"
            exit 1
          fi

          find "$OVERLAY_DIR" -type f ! -name 'UPSTREAM_BASE' | sort | while read overlay; do
            relpath="${overlay#$OVERLAY_DIR/}"

            # 前回の衝突がまだ残っているファイルは触らない(重ねて merge すると入れ子になる)。
            if grep -q '^<<<<<<< ' "$overlay"; then
              echo "UNRESOLVED: $relpath still has conflict markers, skipping"
              HAS_CONFLICT=1
              CONFLICT_COUNT=$((CONFLICT_COUNT + 1))
              echo "$HAS_CONFLICT" > /tmp/has_conflict
              echo "$CONFLICT_COUNT" > /tmp/conflict_count
              jq --arg file "$relpath" \
                 --arg content "Still has unresolved conflict markers from a previous sync. Resolve it first; upstream moved again meanwhile." \
                '. += [{"file": $file, "content": $content, "type": "unresolved"}]' \
                /tmp/conflicts.json > /tmp/conflicts_tmp.json
              mv /tmp/conflicts_tmp.json /tmp/conflicts.json
              continue
            fi

            # Check if file still exists upstream
            if [ ! -f "$relpath" ]; then
              echo "DELETED: $relpath no longer exists upstream"
              DELETED_FILES="$DELETED_FILES\n- \`$relpath\` (file deleted upstream)"
              HAS_CONFLICT=1
              CONFLICT_COUNT=$((CONFLICT_COUNT + 1))
              # Write state for later steps
              echo "$HAS_CONFLICT" > /tmp/has_conflict
              echo "$CONFLICT_COUNT" > /tmp/conflict_count
              # Add to conflicts JSON
              jq --arg file "$relpath" \
                 --arg content "This file was deleted in the new upstream version. Remove the overlay or update the file path." \
                '. += [{"file": $file, "content": $content, "type": "deleted"}]' \
                /tmp/conflicts.json > /tmp/conflicts_tmp.json
              mv /tmp/conflicts_tmp.json /tmp/conflicts.json
              continue
            fi

            # Check if overlay is identical to new upstream (became obsolete)
            if diff -q "$overlay" "$relpath" > /dev/null 2>&1; then
              echo "OBSOLETE: $relpath overlay is identical to upstream"
              OBSOLETE_FILES="$OBSOLETE_FILES\n- \`$relpath\`"
              continue
            fi

            # Extract base version from old upstream commit
            # overlay が新規に足したファイルなら base は空でよい
            git -C "$UPSTREAM" show "$OLD_BASE:$relpath" > /tmp/merge_base 2>/dev/null || : > /tmp/merge_base
            cp "$overlay" /tmp/merge_ours
            cp "$relpath" /tmp/merge_theirs

            # 3-way merge: merge_ours is modified in-place
            if git merge-file -L "noraneko" -L "base" -L "upstream" \
               /tmp/merge_ours /tmp/merge_base /tmp/merge_theirs; then
              cp /tmp/merge_ours "$overlay"
              echo "MERGED: $relpath"
              MERGED_COUNT=$((MERGED_COUNT + 1))
            else
              cp /tmp/merge_ours "$overlay"
              echo "CONFLICT: $relpath"
              HAS_CONFLICT=1
              CONFLICT_COUNT=$((CONFLICT_COUNT + 1))
              echo "$HAS_CONFLICT" > /tmp/has_conflict
              echo "$CONFLICT_COUNT" > /tmp/conflict_count

              jq --arg file "$relpath" \
                 --rawfile content /tmp/merge_ours \
                '. += [{"file": $file, "content": $content, "type": "conflict"}]' \
                /tmp/conflicts.json > /tmp/conflicts_tmp.json
              mv /tmp/conflicts_tmp.json /tmp/conflicts.json
            fi
          done

          # Read back state from subshell
          HAS_CONFLICT=$(cat /tmp/has_conflict 2>/dev/null || echo "0")
          CONFLICT_COUNT=$(cat /tmp/conflict_count 2>/dev/null || echo "0")

          # base を進めるのは衝突が残っていないときだけ。衝突を残したまま進めると、
          # 次回は base=upstream になって、その衝突が見えなくなる(解決後の merge も狂う)。
          if [ "$HAS_CONFLICT" -eq 0 ]; then
            echo "${{ steps.new_version.outputs.commit }}" > "$OVERLAY_DIR/UPSTREAM_BASE"
          else
            echo "Conflicts remain; leaving UPSTREAM_BASE at $OLD_BASE"
          fi

          echo "overlay_conflicts=$CONFLICT_COUNT" >> $GITHUB_OUTPUT
          if [ "$HAS_CONFLICT" -ne 0 ]; then
            echo "overlay_failed=true" >> $GITHUB_OUTPUT
          else
            echo "overlay_failed=false" >> $GITHUB_OUTPUT
            echo "All overlays merged cleanly"
          fi

      - name: Check legacy patches compatibility
        id: patch_check
        if: env.UP_TO_DATE != 'true'
        run: |
          HAS_FAILED=0
          FAILED_PATCHES=""

          if [ -d ".github/patches/upstream" ]; then
            echo "Normalizing patch files..."
            find .github/patches/upstream -name "*.patch" \
              -exec dos2unix {} \; 2>/dev/null || true
            for patch_file in .github/patches/upstream/*.patch; do
              [ -e "$patch_file" ] || continue
              if [ -s "$patch_file" ] && \
                 [ "$(tail -c1 "$patch_file" | wc -l)" -eq 0 ]; then
                echo "" >> "$patch_file"
              fi
              patch_name=$(basename "$patch_file")
              if git apply --check --ignore-space-change \
                 --ignore-whitespace "$patch_file"; then
                echo "OK: $patch_name"
              else
                echo "FAIL: $patch_name"
                FAILED_PATCHES="$FAILED_PATCHES\n- $patch_name"
                HAS_FAILED=1
              fi
            done
          else
            echo "No legacy patches directory"
          fi

          if [ "$HAS_FAILED" -ne 0 ]; then
            echo "FAILED_PATCHES<<EOF" >> $GITHUB_ENV
            echo -e "$FAILED_PATCHES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "patch_failed=true" >> $GITHUB_OUTPUT
          else
            echo "patch_failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if there are any changes
        id: check_changes
        run: |
          if git diff --quiet --exit-code; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes from upstream."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected from upstream."
          fi

      - name: Commit to existing PR branch
        if: steps.check_changes.outputs.has_changes == 'true' && steps.check_pr.outputs.exists == 'true'
        run: |
          VERSION="${{ steps.new_version.outputs.version }}"
          
          git add --force .
          git commit -m "sync: upstream gecko-dev $VERSION"
          git push origin "${{ steps.check_pr.outputs.branch }}"
          echo "BRANCH_NAME=${{ steps.check_pr.outputs.branch }}" >> $GITHUB_ENV
          echo "UPDATE_EXISTING=true" >> $GITHUB_ENV

      - name: Create new PR branch
        if: steps.check_changes.outputs.has_changes == 'true' && steps.check_pr.outputs.exists == 'false'
        run: |
          if git diff --quiet --exit-code; then
            echo "No changes from upstream. Exiting."
            exit 0
          fi

          VERSION="${{ steps.new_version.outputs.version }}"
          BRANCH_NAME="sync/upstream-$VERSION"
          
          git config user.name "f3liz-bot[bot]"
          git config user.email "230694705+f3liz-bot@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add --force .
          git commit -m "sync: upstream gecko-dev $VERSION"
          git push origin "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "UPDATE_EXISTING=false" >> $GITHUB_ENV

      - name: Update existing PR
        if: steps.version_diff.outputs.change_type != 'none' && env.UPDATE_EXISTING == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ steps.check_pr.outputs.number }}');
            const oldVersion = '${{ steps.old_version.outputs.version }}';
            const newVersion = '${{ steps.new_version.outputs.version }}';
            const changeType = '${{ steps.version_diff.outputs.change_type }}';
            const patchFailed = '${{ steps.patch_check.outputs.patch_failed }}' === 'true';
            const failedPatches = process.env.FAILED_PATCHES || '';
            const overlayFailed = '${{ steps.overlay_merge.outputs.overlay_failed }}' === 'true';
            const overlayConflicts = parseInt('${{ steps.overlay_merge.outputs.overlay_conflicts }}') || 0;

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const titleMatch = pr.data.title.match(/^sync: (MAJOR|MINOR|PATCH) upstream ([\d.]+) → ([\d.]+)$/);
            const originalStartVersion = titleMatch ? titleMatch[2] : oldVersion;
            const newTitle = `sync: ${changeType} upstream ${originalStartVersion} → ${newVersion}`;

            let changelogEntry = `\n### ${newVersion}\n`;
            changelogEntry += `- Synced at: ${new Date().toISOString()}\n`;

            if (overlayFailed) {
              changelogEntry += `- Overlay conflicts: ${overlayConflicts} file(s) need resolution (see comments)\n`;
            } else {
              changelogEntry += `- Overlays merged cleanly\n`;
            }
            if (patchFailed) {
              changelogEntry += `- Legacy patch issues:\n${failedPatches}\n`;
            }

            const newBody = pr.data.body + changelogEntry;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              title: newTitle,
              body: newBody
            });

      - name: Create new Pull Request
        id: create_pr
        if: steps.check_changes.outputs.has_changes == 'true' && env.UPDATE_EXISTING == 'false' && env.BRANCH_NAME != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const oldVersion = '${{ steps.old_version.outputs.version }}';
            const newVersion = '${{ steps.new_version.outputs.version }}';
            const changeType = '${{ steps.version_diff.outputs.change_type }}';
            const patchFailed = '${{ steps.patch_check.outputs.patch_failed }}' === 'true';
            const failedPatches = process.env.FAILED_PATCHES || '';
            const overlayFailed = '${{ steps.overlay_merge.outputs.overlay_failed }}' === 'true';
            const overlayConflicts = parseInt('${{ steps.overlay_merge.outputs.overlay_conflicts }}') || 0;

            const title = `sync: ${changeType} upstream ${oldVersion} → ${newVersion}`;

            let body = `## Upstream Sync\n\n`;
            body += `- **Previous version**: ${oldVersion}\n`;
            body += `- **New version**: ${newVersion}\n`;
            body += `- **Change type**: ${changeType}\n\n`;

            body += `## Version History\n\n`;
            body += `### ${newVersion}\n`;
            body += `- Synced at: ${new Date().toISOString()}\n`;

            if (overlayFailed) {
              body += `- Overlay conflicts: ${overlayConflicts} file(s) need resolution (see comments)\n`;
            } else {
              body += `- Overlays merged cleanly\n`;
            }
            if (patchFailed) {
              body += `- Legacy patch issues:\n${failedPatches}\n`;
            }

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              head: process.env.BRANCH_NAME,
              base: 'main',
              body: body
            });
            core.setOutput('number', pr.data.number);

      # 既存 PR でも新規 PR でも同じ一本。衝突したファイルごとに一件。
      - name: Post overlay conflict comments
        if: steps.overlay_merge.outputs.overlay_failed == 'true' && (env.UPDATE_EXISTING == 'true' || steps.create_pr.outputs.number)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = parseInt('${{ steps.check_pr.outputs.number }}' || '${{ steps.create_pr.outputs.number }}');
            const conflicts = JSON.parse(fs.readFileSync('/tmp/conflicts.json', 'utf8'));

            // 本文は 65,536 文字が上限。連投は secondary rate limit に当たるので、間を置く。
            const post = async (text) => {
              const limit = 60000;
              const body = text.length > limit
                ? text.slice(0, limit) + '\n```\n````\n</details>\n\n_(truncated)_'
                : text;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
              await new Promise(r => setTimeout(r, 1500));
            };

            for (const conflict of conflicts) {
              let body;

              if (conflict.type === 'deleted') {
                body = [
                  `### Conflict: \`${conflict.file}\``,
                  '',
                  'This file was **deleted** in the new upstream version.',
                  'If this overlay is no longer needed, reply with:',
                  '',
                  '```',
                  `@f3liz-bot resolve file=${conflict.file} action=delete`,
                  '```',
                  '',
                  'If the file was moved/renamed, create a new overlay at the new path.',
                ].join('\n');
              } else if (conflict.type === 'unresolved') {
                body = [
                  `### Still unresolved: \`${conflict.file}\``,
                  '',
                  conflict.content,
                  'This file was skipped in this sync so the markers do not nest. Resolve it (`@f3liz-bot resolve file=...`), then re-run **Pull Upstream** to merge the newer upstream into it.',
                ].join('\n');
              } else if (conflict.content.length > 50000) {
                // Large file: extract only conflicted regions
                const lines = conflict.content.split('\n');
                const regions = [];
                let regionLines = [];
                let inConflict = false;
                let regionStart = -1;
                const CONTEXT = 10;

                for (let i = 0; i < lines.length; i++) {
                  if (lines[i].startsWith('<<<<<<<')) {
                    inConflict = true;
                    regionStart = Math.max(0, i - CONTEXT);
                    regionLines = lines.slice(regionStart, i);
                  }
                  if (inConflict) {
                    regionLines.push(lines[i]);
                  }
                  if (lines[i].startsWith('>>>>>>>')) {
                    inConflict = false;
                    const regionEnd = Math.min(lines.length, i + CONTEXT + 1);
                    regionLines.push(...lines.slice(i + 1, regionEnd));
                    regions.push({
                      start: regionStart + 1,
                      end: regionEnd,
                      content: regionLines.join('\n')
                    });
                    regionLines = [];
                  }
                }

                for (let r = 0; r < regions.length; r++) {
                  const region = regions[r];
                  body = [
                    `### Conflict: \`${conflict.file}\` (region ${r + 1} of ${regions.length}, lines ${region.start}-${region.end})`,
                    '',
                    '**How to resolve:** Copy the code block below, fix the conflict markers (`<<<<<<<`, `=======`, `>>>>>>>`), and paste as a reply.',
                    '',
                    '<details>',
                    '<summary><b>Reply template</b> — click to expand, copy, resolve, and paste as reply</summary>',
                    '',
                    '````',
                    `@f3liz-bot resolve file=${conflict.file} region=${r + 1}`,
                    '```diff',
                    region.content,
                    '```',
                    '````',
                    '</details>',
                  ].join('\n');

                  await post(body);
                }
                continue;
              } else {
                body = [
                  `### Conflict: \`${conflict.file}\``,
                  '',
                  '**How to resolve:** Copy the code block below, fix the conflict markers (`<<<<<<<`, `=======`, `>>>>>>>`), and paste as a reply.',
                  '',
                  '<details open>',
                  '<summary><b>Reply template</b> (copy this whole block)</summary>',
                  '',
                  '````',
                  `@f3liz-bot resolve file=${conflict.file}`,
                  '```diff',
                  conflict.content,
                  '```',
                  '````',
                  '</details>',
                ].join('\n');
              }

              await post(body);
            }

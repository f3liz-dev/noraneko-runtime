---
# SPDX-License-Identifier: MPL-2.0

name: Daily Build

permissions:
  contents: write

'on':
  push:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug build'
        type: boolean
        default: true
      pgo:
        description: 'Enable Profile-Guided Optimization'
        type: boolean
        default: true
      omnijar_compress:
        description: 'Omni.ja compression algorithm'
        type: choice
        options: [deflate, zstd, lz4, none]
        default: deflate

run-name: Daily Build${{ (inputs.debug || github.event_name == 'schedule') && ' (Debug)' || '' }}

jobs:
  build-linux-x86_64:
    name: Linux x86_64${{ inputs.pgo && ' (PGO Stage 1)' || '' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: .github/ci/go.sum

      - name: Prepare host
        run: |
          cd .github/ci
          go run . prepare-host

      - name: Build
        run: |
          cd .github/ci
          go run . build \
            -platform=linux -arch=x86_64 \
            -debug=${{ inputs.debug == true || github.event_name == 'schedule' }} \
            -pgo=${{ inputs.pgo == true && github.event_name != 'schedule' }} \
            -pgo-mode=${{ (inputs.pgo == true && github.event_name != 'schedule') && 'generate' || '' }} \
            -omnijar-compress=${{ inputs.omnijar_compress || 'deflate' }} \
            -output=../../output

      - uses: actions/upload-artifact@v4
        with:
          name: noraneko-linux-x86_64-moz-artifact
          path: output/*

  build-linux-aarch64:
    name: Linux aarch64${{ inputs.pgo && ' (PGO Stage 1)' || '' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: .github/ci/go.sum

      - name: Prepare host
        run: |
          cd .github/ci
          go run . prepare-host

      - name: Build
        run: |
          cd .github/ci
          go run . build \
            -platform=linux -arch=aarch64 \
            -debug=${{ inputs.debug == true || github.event_name == 'schedule' }} \
            -pgo=${{ inputs.pgo == true && github.event_name != 'schedule' }} \
            -pgo-mode=${{ (inputs.pgo == true && github.event_name != 'schedule') && 'generate' || '' }} \
            -omnijar-compress=${{ inputs.omnijar_compress || 'deflate' }} \
            -output=../../output

      - uses: actions/upload-artifact@v4
        with:
          name: noraneko-linux-aarch64-moz-artifact
          path: output/*

  build-windows-x86_64:
    name: Windows x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: .github/ci/go.sum

      - name: Prepare host
        run: |
          cd .github/ci
          go run . prepare-host

      - name: Build
        run: |
          cd .github/ci
          go run . build \
            -platform=windows -arch=x86_64 \
            -debug=${{ inputs.debug == true || github.event_name == 'schedule' }} \
            -omnijar-compress=${{ inputs.omnijar_compress || 'deflate' }} \
            -output=../../output

      - uses: actions/upload-artifact@v4
        with:
          name: noraneko-windows-x86_64-moz-artifact
          path: output/*

  generate-pgo-profile:
    name: Linux x86_64 PGO Stage 2
    if: ${{ inputs.pgo == true && github.event_name != 'schedule' }}
    needs: build-linux-x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: noraneko-linux-x86_64-moz-artifact
          path: /tmp/artifact

      - name: Setup and generate profile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget gnupg software-properties-common
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          echo 'deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main' | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libdbus-glib-1-2 libxt6 libx11-xcb1 \
            libasound2 libpulse0 libgl1 libglib2.0-0 fonts-liberation \
            libdrm2 libgbm1 libxcomposite1 libxdamage1 libxrandr2 \
            libxshmfence1 libxtst6 xvfb python3 python3-pip llvm-19
          
          mkdir -p /tmp/clang/bin obj-firefox/dist/firefox
          cp /usr/bin/llvm-profdata-19 /tmp/clang/llvm-profdata
          chmod +x /tmp/clang/llvm-profdata
          
          cd /tmp/artifact
          tar -xf *.tar.* 2>/dev/null || unzip -q *.zip 2>/dev/null || true
          cp -r noraneko*/* $GITHUB_WORKSPACE/obj-firefox/dist/firefox/ || \
          cp -r firefox*/* $GITHUB_WORKSPACE/obj-firefox/dist/firefox/ || true
          
          cd $GITHUB_WORKSPACE
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 3
          pip3 install requests
          
          BROWSER=$(find obj-firefox/dist/firefox -name "noraneko" -o -name "firefox" | head -1)
          chmod +x "$BROWSER"
          
          DISPLAY=:99 LLVM_PROFDATA=/tmp/clang/llvm-profdata JARLOG_FILE=en-US.log \
            MOZ_DISABLE_CONTENT_SANDBOX=1 MOZ_DISABLE_GMP_SANDBOX=1 \
            timeout 1200 python3 build/pgo/profileserver.py --binary "$BROWSER" || true
          
          pkill Xvfb || true

      - uses: actions/upload-artifact@v4
        with:
          name: noraneko-linux-x86_64-profile-output
          path: |
            merged.profdata
            en-US.log
          retention-days: 7

  build-pgo-final:
    name: Linux x86_64 PGO Stage 3
    if: ${{ inputs.pgo == true && github.event_name != 'schedule' }}
    needs: generate-pgo-profile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: .github/ci/go.sum

      - uses: actions/download-artifact@v4
        with:
          name: noraneko-linux-x86_64-profile-output
          path: ~/artifacts

      - name: Prepare host
        run: |
          cd .github/ci
          go run . prepare-host

      - name: Build with PGO
        run: |
          cd .github/ci
          go run . build \
            -platform=linux -arch=x86_64 \
            -debug=${{ inputs.debug == true }} \
            -pgo=true -pgo-mode=use \
            -omnijar-compress=${{ inputs.omnijar_compress || 'deflate' }} \
            -output=../../output

      - uses: geekyeggo/delete-artifact@v5
        with:
          name: noraneko-linux-x86_64-moz-artifact

      - uses: actions/upload-artifact@v4
        with:
          name: noraneko-linux-x86_64-moz-artifact
          path: output/*

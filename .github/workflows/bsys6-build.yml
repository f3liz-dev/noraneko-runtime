---
# SPDX-License-Identifier: MPL-2.0

name: Build (bsys6)

permissions:
  contents: write

'on':
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform (linux, windows, macos)'
        type: choice
        options:
          - linux
          - windows
          - macos
        default: linux
        required: true
      arch:
        description: 'Target architecture'
        type: choice
        options:
          - x86_64
          - aarch64
        default: x86_64
        required: true
      debug:
        description: 'Enable debug build'
        required: false
        type: boolean
        default: true
      pgo:
        description: 'Enable Profile-Guided Optimization'
        required: false
        type: boolean
        default: false
      pgo-mode:
        description: 'PGO mode (generate, use)'
        type: choice
        options:
          - ''
          - generate
          - use
        default: ''
        required: false
      pgo-profile-url:
        description: 'URL to PGO profile (merged.profdata)'
        required: false
        type: string
      skip-tests:
        description: 'Skip building tests for faster build'
        required: false
        type: boolean
        default: true

run-name: >-
  [bsys6] ${{ inputs.platform }}-${{ inputs.arch }}
  ${{ inputs.pgo && (inputs.pgo-mode && format('[PGO:{0}]', inputs.pgo-mode) || '[PGO]') || '' }}
  ${{ inputs.debug && 'Debug' || '' }}

jobs:
  build:
    name: Build ${{ inputs.platform }}-${{ inputs.arch }}${{ inputs.pgo && (inputs.pgo-mode && format(' (PGO:{0})', inputs.pgo-mode) || ' (PGO)') || '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare host
        run: |
          cd .github/bsys6
          ./bsys6 prepare-host
        env:
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}

      - name: Build
        run: |
          cd .github/bsys6
          TARGET=${{ inputs.platform }} \
          ARCH=${{ inputs.arch }} \
          DEBUG=${{ inputs.debug }} \
          PGO=${{ inputs.pgo }} \
          PGO_MODE=${{ inputs.pgo-mode }} \
          PGO_PROFILE_URL=${{ inputs.pgo-profile-url }} \
          SKIP_TESTS=${{ inputs.skip-tests }} \
          ./bsys6 prepare build package
        env:
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: noraneko-${{ inputs.platform }}-${{ inputs.arch }}${{ inputs.pgo && (inputs.pgo-mode && format('-pgo-{0}', inputs.pgo-mode) || '-pgo') || '' }}-moz-artifact
          path: |
            .github/bsys6/*.tar.xz
            .github/bsys6/*.zip
            .github/bsys6/*.dmg

---
# SPDX-License-Identifier: MPL-2.0

name: F3liz Bot Resolve Overlay Conflict

'on':
  issue_comment:
    types: [created]

jobs:
  resolve-overlay:
    name: Apply resolved overlay from PR comment
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@f3liz-bot resolve')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Parse resolve command
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body;

            // Extract file path
            const fileMatch = body.match(/@f3liz-bot\s+resolve\s+file=(\S+)/);
            if (!fileMatch) {
              core.setFailed('No file= parameter found in @f3liz-bot resolve command');
              return;
            }
            const file = fileMatch[1];

            // Check for delete action
            const actionMatch = body.match(/action=(\w+)/);
            if (actionMatch && actionMatch[1] === 'delete') {
              core.setOutput('file', file);
              core.setOutput('action', 'delete');
              core.setOutput('region', '');
              return;
            }

            // Extract region if present
            const regionMatch = body.match(/region=(\d+)/);
            const region = regionMatch ? regionMatch[1] : '';

            // Extract code block content (between first ``` pair)
            // Normalize line endings, handle optional trailing spaces on fence lines
            const normalized = body.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            // Try multiple fence patterns: ```lang, ```, ````lang, ````
            const codeMatch = normalized.match(/`{3,}\w*\s*\n([\s\S]*?)\n\s*`{3,}/)
            if (!codeMatch) {
              core.setFailed('No code block found in comment. Wrap resolved content in ``` fences.');
              // Log chars around first backtick to help debug
              const idx = normalized.indexOf('`');
              if (idx >= 0) {
                core.info('Context around first backtick: ' + JSON.stringify(normalized.substring(Math.max(0, idx - 20), idx + 40)));
              } else {
                core.info('No backtick found in body at all');
              }
              core.info('Body length: ' + body.length);
              return;
            }

            const fs = require('fs');
            fs.writeFileSync('/tmp/resolved_content.txt', codeMatch[1]);

            core.setOutput('file', file);
            core.setOutput('action', 'replace');
            core.setOutput('region', region);

      - name: Get PR info
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.issue.number }}
          PR_INFO=$(gh pr view $PR_NUMBER --repo ${{ github.repository }} --json headRefName,headRepository)
          HEAD_REF=$(echo "$PR_INFO" | jq -r .headRefName)
          HEAD_OWNER=$(echo "$PR_INFO" | jq -r '.headRepository.owner.login // empty')
          HEAD_REPO=$(echo "$PR_INFO" | jq -r '.headRepository.name // empty')

          if [ -z "$HEAD_OWNER" ] || [ "$HEAD_OWNER" = "null" ]; then
            HEAD_OWNER="${{ github.repository_owner }}"
          fi

          echo "head_ref=$HEAD_REF" >> $GITHUB_OUTPUT
          echo "head_owner=$HEAD_OWNER" >> $GITHUB_OUTPUT
          echo "head_repo=$HEAD_REPO" >> $GITHUB_OUTPUT

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr_info.outputs.head_owner }}/${{ steps.pr_info.outputs.head_repo }}
          ref: ${{ steps.pr_info.outputs.head_ref }}
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "f3liz-bot[bot]"
          git config user.email "230694705+f3liz-bot@users.noreply.github.com"

      - name: Apply resolution (delete)
        if: steps.parse.outputs.action == 'delete'
        run: |
          FILE="${{ steps.parse.outputs.file }}"
          OVERLAY=".github/overlays/$FILE"

          if [ -f "$OVERLAY" ]; then
            rm "$OVERLAY"
            # Remove empty parent directories
            find ".github/overlays" -type d -empty -delete 2>/dev/null || true
            echo "Deleted overlay: $FILE"
          else
            echo "Overlay not found: $OVERLAY"
            exit 1
          fi

      - name: Apply resolution (full file)
        if: steps.parse.outputs.action == 'replace' && steps.parse.outputs.region == ''
        run: |
          FILE="${{ steps.parse.outputs.file }}"
          OVERLAY=".github/overlays/$FILE"
          mkdir -p "$(dirname "$OVERLAY")"
          cp /tmp/resolved_content.txt "$OVERLAY"
          echo "Updated overlay: $FILE"

      - name: Apply resolution (region)
        if: steps.parse.outputs.action == 'replace' && steps.parse.outputs.region != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = '${{ steps.parse.outputs.file }}';
            const regionNum = parseInt('${{ steps.parse.outputs.region }}');
            const overlayPath = `.github/overlays/${file}`;

            if (!fs.existsSync(overlayPath)) {
              core.setFailed(`Overlay not found: ${overlayPath}`);
              return;
            }

            const overlay = fs.readFileSync(overlayPath, 'utf8');
            const resolved = fs.readFileSync('/tmp/resolved_content.txt', 'utf8');
            const lines = overlay.split('\n');
            const resolvedLines = resolved.split('\n');

            // Find the Nth conflict region
            let currentRegion = 0;
            let regionStartLine = -1;
            let regionEndLine = -1;

            for (let i = 0; i < lines.length; i++) {
              if (lines[i].startsWith('<<<<<<<')) {
                currentRegion++;
                if (currentRegion === regionNum) {
                  // Walk back to find context start (match first line of resolved)
                  regionStartLine = i;
                  for (let j = i - 1; j >= Math.max(0, i - 20); j--) {
                    if (lines[j].trim() === resolvedLines[0].trim()) {
                      regionStartLine = j;
                      break;
                    }
                  }
                }
              }
              if (lines[i].startsWith('>>>>>>>') && currentRegion === regionNum) {
                regionEndLine = i;
                // Walk forward to find context end (match last line of resolved)
                for (let j = i + 1; j < Math.min(lines.length, i + 20); j++) {
                  if (lines[j].trim() === resolvedLines[resolvedLines.length - 1].trim()) {
                    regionEndLine = j;
                    break;
                  }
                }
                break;
              }
            }

            if (regionStartLine === -1 || regionEndLine === -1) {
              core.setFailed(`Could not find conflict region ${regionNum} in ${overlayPath}`);
              return;
            }

            const result = [
              ...lines.slice(0, regionStartLine),
              ...resolvedLines,
              ...lines.slice(regionEndLine + 1)
            ];

            fs.writeFileSync(overlayPath, result.join('\n'));
            console.log(`Resolved region ${regionNum} in ${file} (lines ${regionStartLine}-${regionEndLine})`);

      - name: Validate no remaining conflicts
        id: validate
        run: |
          FILE="${{ steps.parse.outputs.file }}"
          OVERLAY=".github/overlays/$FILE"

          if [ ! -f "$OVERLAY" ]; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if grep -qE '^(<<<<<<<|=======|>>>>>>>)' "$OVERLAY"; then
            REMAINING=$(grep -c '^<<<<<<<' "$OVERLAY" || true)
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "remaining=$REMAINING" >> $GITHUB_OUTPUT
          else
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .github/overlays/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          FILE="${{ steps.parse.outputs.file }}"
          ACTION="${{ steps.parse.outputs.action }}"

          if [ "$ACTION" = "delete" ]; then
            git commit -m "fix(overlay): remove $FILE"
          else
            git commit -m "fix(overlay): resolve conflict in $FILE"
          fi

          git push origin HEAD:${{ steps.pr_info.outputs.head_ref }}

      - name: Comment on success
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const file = '${{ steps.parse.outputs.file }}';
            const action = '${{ steps.parse.outputs.action }}';
            const hasConflicts = '${{ steps.validate.outputs.has_conflicts }}' === 'true';
            const remaining = parseInt('${{ steps.validate.outputs.remaining }}') || 0;

            let body;
            if (action === 'delete') {
              body = `Overlay \`${file}\` has been removed.`;
            } else if (hasConflicts) {
              body = `Resolved the specified region in \`${file}\`, but **${remaining} conflict(s) remain**. Please resolve the remaining conflicts.`;
            } else {
              body = `Overlay \`${file}\` has been resolved and committed. No remaining conflicts in this file.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Failed to apply resolution. Check the [workflow run](${runUrl}) for details.`
            });

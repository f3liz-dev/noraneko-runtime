---
# SPDX-License-Identifier: MPL-2.0

name: Daily Build (bsys6)

permissions:
  contents: write

'on':
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug build'
        type: boolean
        default: true
      pgo:
        description: 'Enable Profile-Guided Optimization'
        type: boolean
        default: true

run-name: Daily Build (bsys6)${{ (inputs.debug || github.event_name == 'push') && ' (Debug)' || '' }}

jobs:
  build-linux-x86_64:
    name: Linux x86_64${{ inputs.pgo && ' (PGO Stage 1)' || '' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare host
        run: |
          cd .github/bsys6
          ./bsys6 prepare-host
        env:
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}

      - name: Build
        run: |
          cd .github/bsys6
          TARGET=linux \
          ARCH=x86_64 \
          DEBUG=${{ inputs.debug == true || github.event_name == 'push' }} \
          PGO=${{ inputs.pgo == true && github.event_name != 'push' }} \
          PGO_MODE=${{ (inputs.pgo == true && github.event_name != 'push') && 'generate' || '' }} \
          SKIP_TESTS=true \
          ./bsys6 prepare build package
        env:
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: noraneko-linux-x86_64-moz-artifact
          path: .github/bsys6/*.tar.xz

  build-linux-aarch64:
    name: Linux aarch64${{ inputs.pgo && ' (PGO Stage 1)' || '' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare host
        run: |
          cd .github/bsys6
          ./bsys6 prepare-host
        env:
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}

      - name: Build
        run: |
          cd .github/bsys6
          TARGET=linux \
          ARCH=aarch64 \
          DEBUG=${{ inputs.debug == true || github.event_name == 'push' }} \
          PGO=${{ inputs.pgo == true && github.event_name != 'push' }} \
          PGO_MODE=${{ (inputs.pgo == true && github.event_name != 'push') && 'generate' || '' }} \
          SKIP_TESTS=true \
          ./bsys6 prepare build package
        env:
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: noraneko-linux-aarch64-moz-artifact
          path: .github/bsys6/*.tar.xz

  build-windows-x86_64:
    name: Windows x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare host
        run: |
          cd .github/bsys6
          ./bsys6 prepare-host
        env:
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}

      - name: Build
        run: |
          cd .github/bsys6
          TARGET=windows \
          ARCH=x86_64 \
          DEBUG=${{ inputs.debug == true || github.event_name == 'push' }} \
          SKIP_TESTS=true \
          ./bsys6 prepare build package
        env:
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: noraneko-windows-x86_64-moz-artifact
          path: .github/bsys6/*.zip

  generate-pgo-profile:
    name: Linux x86_64 PGO Stage 2
    if: ${{ inputs.pgo == true && github.event_name != 'push' }}
    needs: build-linux-x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: noraneko-linux-x86_64-moz-artifact
          path: /tmp/artifact

      - name: Setup and generate profile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget gnupg software-properties-common
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          echo 'deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main' | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libdbus-glib-1-2 libxt6 libx11-xcb1 \
            libasound2 libpulse0 libgl1 libglib2.0-0 fonts-liberation \
            libdrm2 libgbm1 libxcomposite1 libxdamage1 libxrandr2 \
            libxshmfence1 libxtst6 xvfb python3 python3-pip llvm-19
          
          mkdir -p /tmp/clang/bin obj-firefox/dist/firefox
          cp /usr/bin/llvm-profdata-19 /tmp/clang/llvm-profdata
          chmod +x /tmp/clang/llvm-profdata
          
          cd /tmp/artifact
          tar -xf *.tar.* 2>/dev/null || unzip -q *.zip 2>/dev/null || true
          
          # Find the browser binary more robustly
          BROWSER=$(find . -maxdepth 3 -executable -type f -name "noraneko" -o -name "firefox" | head -1)
          if [ -z "$BROWSER" ]; then
            echo "Error: Could not find browser binary in artifact"
            exit 1
          fi
          echo "Found browser at: $BROWSER"
          chmod +x "$BROWSER"
          
          # Prepare directory for profileserver
          mkdir -p $GITHUB_WORKSPACE/obj-firefox/dist/firefox/
          cp -r $(dirname "$BROWSER")/* $GITHUB_WORKSPACE/obj-firefox/dist/firefox/
          
          cd $GITHUB_WORKSPACE
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 3
          pip3 install requests
          
          NEW_BROWSER="$GITHUB_WORKSPACE/obj-firefox/dist/firefox/$(basename "$BROWSER")"
          
          DISPLAY=:99 LLVM_PROFDATA=/tmp/clang/llvm-profdata JARLOG_FILE=en-US.log \
            MOZ_DISABLE_CONTENT_SANDBOX=1 MOZ_DISABLE_GMP_SANDBOX=1 \
            timeout 1200 python3 build/pgo/profileserver.py --binary "$NEW_BROWSER"
          
          # Verify profiles were generated
          if [ ! -f "merged.profdata" ]; then
            echo "Error: merged.profdata was not generated"
            exit 1
          fi
          if [ ! -f "en-US.log" ]; then
            echo "Error: en-US.log was not generated"
            exit 1
          fi
          
          pkill Xvfb || true

      - uses: actions/upload-artifact@v4
        with:
          name: noraneko-linux-x86_64-profile-output
          path: |
            merged.profdata
            en-US.log
          retention-days: 7

  build-pgo-final:
    name: Linux x86_64 PGO Stage 3
    if: ${{ inputs.pgo == true && github.event_name != 'push' }}
    needs: generate-pgo-profile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: noraneko-linux-x86_64-profile-output
          path: ~/artifacts

      - name: Prepare host
        run: |
          cd .github/bsys6
          ./bsys6 prepare-host
        env:
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}

      - name: Build with PGO
        run: |
          cd .github/bsys6
          TARGET=linux \
          ARCH=x86_64 \
          DEBUG=${{ inputs.debug == true }} \
          PGO=true \
          PGO_MODE=use \
          PGO_PROFILE_PATH=~/artifacts/merged.profdata \
          PGO_JARLOG_PATH=~/artifacts/en-US.log \
          SKIP_TESTS=true \
          ./bsys6 prepare build package
        env:
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}

      - uses: geekyeggo/delete-artifact@v5
        with:
          name: noraneko-linux-x86_64-moz-artifact

      - uses: actions/upload-artifact@v4
        with:
          name: noraneko-linux-x86_64-moz-artifact
          path: .github/bsys6/*.tar.xz

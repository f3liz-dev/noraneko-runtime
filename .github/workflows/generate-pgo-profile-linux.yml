---
# SPDX-License-Identifier: MPL-2.0

name: Generate PGO Profile (Linux)

'on':
  workflow_call:
    inputs:
      browser-artifact-name:
        description: 'Browser artifact to download'
        required: true
        type: string
      artifact-path:
        description: 'Path where browser artifact will be placed'
        required: false
        type: string
        default: '/home/runner/artifact'
      runner:
        description: 'Runner label to execute on'
        required: false
        type: string
        default: 'ubuntu-latest'
      target-arch:
        description: 'Target architecture (x86_64, aarch64)'
        required: false
        type: string
        default: 'x86_64'
      upload-artifact-name:
        description: 'Name for uploaded profile data artifact'
        required: false
        type: string

env:
  PROFILE_OUTPUT_DIR: '/tmp/output'
  CLANG_TOOLS_DIR: '/tmp/clang'
  BROWSER_DIST_PATH: 'obj-firefox/dist/firefox'

jobs:
  generate-profdata-and-jarlog:
    name: Generate PGO Profile Data (${{ inputs.target-arch }})
    runs-on: ${{ inputs.runner }}
    
    env:
      UPLOAD_ARTIFACT_NAME: >-
        ${{ inputs.upload-artifact-name ||
        format('{0}-profile-generate-output', inputs.browser-artifact-name) }}
      IS_ARM64: ${{ inputs.target-arch == 'aarch64' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download browser artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.browser-artifact-name }}
          path: ${{ inputs.artifact-path }}

      - name: Set up QEMU for ARM64 emulation
        if: env.IS_ARM64 == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Install system dependencies
        run: |
          sudo apt update -qq
          
          if [[ "$IS_ARM64" == "true" ]]; then
            sudo apt install -y qemu-user-static binfmt-support xvfb
            docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          else
            sudo apt install -y xvfb llvm-19 clang-19 ruby
          fi

      - name: Bootstrap Mozilla build environment
        run: |
          chmod +x ./mach
          ./mach --no-interactive bootstrap --application-choice browser

      - name: Prepare build directories
        run: |
          mkdir -p "$BROWSER_DIST_PATH" "$PROFILE_OUTPUT_DIR" "$CLANG_TOOLS_DIR/bin"

      - name: Setup LLVM profdata tool
        run: |
          if [[ "$IS_ARM64" == "true" ]]; then
            docker run --rm \
              -v "$CLANG_TOOLS_DIR:$CLANG_TOOLS_DIR" \
              --platform linux/arm64 \
              ubuntu:24.04 bash -c "
                apt update -qq && 
                apt install -y llvm-19 && 
                cp /usr/bin/llvm-profdata-19 $CLANG_TOOLS_DIR/llvm-profdata-arm64 &&
                chmod +x $CLANG_TOOLS_DIR/llvm-profdata-arm64
              "
            
            cat > "$CLANG_TOOLS_DIR/bin/llvm-profdata" << 'EOF'
          #!/bin/bash
          exec $CLANG_TOOLS_DIR/llvm-profdata-arm64 "$@"
          EOF
            chmod +x "$CLANG_TOOLS_DIR/bin/llvm-profdata"
          else
            ln -sf $(which llvm-profdata-19) "$CLANG_TOOLS_DIR/bin/llvm-profdata"
          fi

      - name: Extract browser artifact
        run: |
          cd "${{ inputs.artifact-path }}"
          
          if ls *.tar.* >/dev/null 2>&1; then
            tar -xf *.tar.*
          elif ls *.zip >/dev/null 2>&1; then
            unzip -q *.zip
          fi

      - name: Locate and install browser
        shell: ruby {0}
        run: |
          require 'fileutils'
          require 'find'
          
          artifact_path = '${{ inputs.artifact-path }}'
          browser_dist_path = "#{ENV['GITHUB_WORKSPACE']}/#{ENV['BROWSER_DIST_PATH']}"
          binary_names = ['noraneko', 'noraneko-bin', 'firefox', 'firefox-bin']
          
          Dir.chdir(artifact_path)
          
          browser_dir = nil
          Dir.glob('**/*').each do |path|
            if File.file?(path) && binary_names.any? { |name| File.basename(path) == name }
              browser_dir = File.dirname(path)
              puts "Found browser binary: #{path}"
              break
            end
          end
          
          browser_dir ||= Dir.glob('*').find { |dir| File.directory?(dir) && (dir.include?('noraneko') || dir.include?('firefox')) }
          
          if browser_dir && File.directory?(browser_dir)
            FileUtils.mkdir_p(browser_dist_path)
            FileUtils.cp_r("#{browser_dir}/.", browser_dist_path)
          else
            puts "ERROR: Browser directory not found"
            exit 1
          end

      - name: Create profile generation script
        shell: ruby {0}
        run: |
          require 'fileutils'
          require 'find'
          
          browser_dist_path = ENV['BROWSER_DIST_PATH']
          binary_names = ['noraneko', 'noraneko-bin', 'firefox', 'firefox-bin']
          
          browser = nil
          Find.find(browser_dist_path) do |path|
            if File.file?(path) && binary_names.include?(File.basename(path))
              browser = path
              break
            end
          end
          
          if browser.nil?
            puts "ERROR: No browser binary found"
            exit 1
          end
          
          FileUtils.chmod(0755, browser)
          
          script = <<~SCRIPT
          #!/bin/bash
          set -e
          export MOZ_FETCHES_DIR=/tmp
          export JARLOG_FILE=en-US.log
          export LLVM_PROFDATA="$CLANG_TOOLS_DIR/bin/llvm-profdata"
          export DISPLAY=:99
          "#{browser}" --version || echo "Version check failed"
          ./mach python build/pgo/profileserver.py --binary "#{browser}"
          SCRIPT
          
          File.write('/tmp/generate_profile.sh', script)
          FileUtils.chmod(0755, '/tmp/generate_profile.sh')

      - name: Generate PGO profile data
        run: |
          set -e
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 &
          XVFB_PID=$!
          sleep 3
          
          if [[ "$IS_ARM64" == "true" ]]; then
            [[ -f "/usr/bin/qemu-aarch64-static" ]] || { echo "ERROR: qemu-aarch64-static not found"; kill $XVFB_PID; exit 1; }
            
            [[ -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]] || {
              docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
              sleep 2
            }
            
            docker run --rm --platform linux/arm64 \
              -v "$PWD:/workspace" -v /tmp:/tmp \
              -e MOZ_FETCHES_DIR=/tmp -e JARLOG_FILE=en-US.log \
              -e LLVM_PROFDATA="$CLANG_TOOLS_DIR/bin/llvm-profdata" \
              -e DISPLAY=:99 -e MOZ_PGO_TIMEOUT_MULTIPLIER=5 \
              --network host -w /workspace \
              ubuntu:24.04 \
              bash -c "apt update -qq && apt install -y python3 file && /tmp/generate_profile.sh"
            PROFILE_EXIT=$?
          else
            /tmp/generate_profile.sh
            PROFILE_EXIT=$?
          fi
          
          kill $XVFB_PID 2>/dev/null || true
          
          [[ $PROFILE_EXIT -eq 0 ]] || { echo "ERROR: Profile generation failed"; exit $PROFILE_EXIT; }

      - name: Verify generated profile data
        shell: ruby {0}
        run: |
          ['merged.profdata', 'en-US.log'].each do |f|
            unless File.exist?(f)
              puts "ERROR: #{f} not found"
              exit 1
            end
          end
          
          if File.zero?('merged.profdata')
            puts "ERROR: merged.profdata is empty"
            exit 1
          end
          
          puts "✓ Profile data validation successful"

      - name: Upload profile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UPLOAD_ARTIFACT_NAME }}
          path: |
            merged.profdata
            en-US.log
          retention-days: 7

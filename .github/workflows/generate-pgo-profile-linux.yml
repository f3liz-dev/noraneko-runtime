---
# SPDX-License-Identifier: MPL-2.0

name: Generate PGO Profile (Linux)

'on':
  workflow_call:
    inputs:
      browser-artifact-name:
        description: 'Browser artifact to download'
        required: true
        type: string
      artifact-path:
        description: 'Path where browser artifact will be placed'
        required: false
        type: string
        default: '/tmp/artifact'
      runner:
        description: 'Runner label to execute on'
        required: false
        type: string
        default: 'ubuntu-latest'
      target-arch:
        description: 'Target architecture (x86_64, aarch64)'
        required: false
        type: string
        default: 'x86_64'
      upload-artifact-name:
        description: 'Name for uploaded profile data artifact'
        required: false
        type: string

env:
  PROFILE_OUTPUT_DIR: '/tmp/output'
  CLANG_TOOLS_DIR: '/tmp/clang'
  BROWSER_DIST_PATH: 'obj-firefox/dist/firefox'

jobs:
  generate-profdata-and-jarlog:
    name: Generate PGO Profile Data (${{ inputs.target-arch }})
    runs-on: ${{ inputs.target-arch == 'aarch64' && 'macos-26' || inputs.runner }}
    
    env:
      UPLOAD_ARTIFACT_NAME: >-
        ${{ inputs.upload-artifact-name ||
        format('{0}-profile-generate-output', inputs.browser-artifact-name) }}
      IS_ARM64: ${{ inputs.target-arch == 'aarch64' }}
      PLATFORM: ${{ inputs.target-arch == 'aarch64' && 'linux/arm64' || 'linux/amd64' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download browser artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.browser-artifact-name }}
          path: ${{ inputs.artifact-path }}

      - name: Setup Docker (macOS)
        if: runner.os == 'macOS'
        run: |
          # Docker Desktop is pre-installed on macOS runners
          # Just verify it's running
          docker info

      - name: Prepare host directories
        run: |
          mkdir -p "$BROWSER_DIST_PATH" "$PROFILE_OUTPUT_DIR" "$CLANG_TOOLS_DIR/bin"

      - name: Setup LLVM profdata tool in container
        run: |
          docker run --rm \
            -v "$CLANG_TOOLS_DIR:$CLANG_TOOLS_DIR" \
            --platform "$PLATFORM" \
            debian:bookworm-slim bash -c "
              apt-get update -qq && \
              apt-get install -y --no-install-recommends llvm-19 && \
              PROFDATA_NAME='llvm-profdata-x86_64'
              if [[ '$IS_ARM64' == 'true' ]]; then
                PROFDATA_NAME='llvm-profdata-arm64'
              fi
              cp /usr/bin/llvm-profdata-19 $CLANG_TOOLS_DIR/\$PROFDATA_NAME &&
              chmod +x $CLANG_TOOLS_DIR/\$PROFDATA_NAME
            "
          
          cat > "$CLANG_TOOLS_DIR/bin/llvm-profdata" << 'EOF'
          #!/bin/sh
          SCRIPT_DIR="$(dirname "$(readlink -f "$0" 2>/dev/null || realpath "$0")")"
          PROFDATA_NAME="llvm-profdata-x86_64"
          if [ "$(uname -m)" = "aarch64" ]; then
            PROFDATA_NAME="llvm-profdata-arm64"
          fi
          exec "$SCRIPT_DIR/../$PROFDATA_NAME" "$@"
          EOF
          chmod +x "$CLANG_TOOLS_DIR/bin/llvm-profdata"

      - name: Extract browser artifact
        run: |
          cd "${{ inputs.artifact-path }}"
          
          if ls *.tar.* >/dev/null 2>&1; then
            tar -xf *.tar.*
          elif ls *.zip >/dev/null 2>&1; then
            unzip -q *.zip
          fi

      - name: Locate and install browser
        shell: ruby {0}
        run: |
          require 'fileutils'
          require 'find'
          
          artifact_path = '${{ inputs.artifact-path }}'
          browser_dist_path = "#{ENV['GITHUB_WORKSPACE']}/#{ENV['BROWSER_DIST_PATH']}"
          binary_names = ['noraneko', 'noraneko-bin', 'firefox', 'firefox-bin']
          
          Dir.chdir(artifact_path)
          
          browser_dir = nil
          Dir.glob('**/*').each do |path|
            if File.file?(path) && binary_names.any? { |name| File.basename(path) == name }
              browser_dir = File.dirname(path)
              puts "Found browser binary: #{path}"
              break
            end
          end
          
          browser_dir ||= Dir.glob('*').find { |dir| File.directory?(dir) && (dir.include?('noraneko') || dir.include?('firefox')) }
          
          if browser_dir && File.directory?(browser_dir)
            FileUtils.mkdir_p(browser_dist_path)
            FileUtils.cp_r("#{browser_dir}/.", browser_dist_path)
          else
            puts "ERROR: Browser directory not found"
            exit 1
          end

      - name: Find browser binary path
        id: find-binary
        shell: ruby {0}
        run: |
          require 'find'
          
          browser_dist_path = ENV['BROWSER_DIST_PATH']
          binary_names = ['noraneko', 'noraneko-bin', 'firefox', 'firefox-bin']
          
          browser = nil
          Find.find(browser_dist_path) do |path|
            if File.file?(path) && binary_names.include?(File.basename(path))
              browser = path
              break
            end
          end
          
          if browser.nil?
            puts "ERROR: No browser binary found"
            exit 1
          end
          
          FileUtils.chmod(0755, browser)
          
          # Export for next steps
          File.open(ENV['GITHUB_OUTPUT'], 'a') do |f|
            f.puts "binary-path=#{browser}"
          end
          
          puts "Found binary: #{browser}"

      - name: Setup Python and uv (host)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup uv (host)
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: ".github/scripts/firefox-profileserver/pyproject.toml"

      - name: Sync uv dependencies (host)
        working-directory: .github/scripts/firefox-profileserver
        run: |
          uv sync

      - name: Generate PGO profile data
        env:
          MOZ_FETCHES_DIR: /tmp
          JARLOG_FILE: en-US.log
          LLVM_PROFDATA: ${{ env.CLANG_TOOLS_DIR }}/bin/llvm-profdata
          MOZ_PGO_TIMEOUT_MULTIPLIER: 5
          MOZ_DISABLE_CONTENT_SANDBOX: 1
          MOZ_DISABLE_GMP_SANDBOX: 1
        run: |
          set -e
          
          # Get absolute paths
          WORKSPACE_ABS="$(cd "$GITHUB_WORKSPACE" && pwd)"
          BINARY_ABS="$(cd "$(dirname "${{ steps.find-binary.outputs.binary-path }}")" && pwd)/$(basename "${{ steps.find-binary.outputs.binary-path }}")"
          
          docker run --rm --platform "$PLATFORM" \
            -v "$WORKSPACE_ABS:/workspace" \
            -v "$CLANG_TOOLS_DIR:$CLANG_TOOLS_DIR" \
            -v /tmp:/tmp \
            -e MOZ_FETCHES_DIR=/tmp \
            -e JARLOG_FILE=en-US.log \
            -e LLVM_PROFDATA="$CLANG_TOOLS_DIR/bin/llvm-profdata" \
            -e DISPLAY=:99 \
            -e MOZ_PGO_TIMEOUT_MULTIPLIER=5 \
            -e MOZ_DISABLE_CONTENT_SANDBOX=1 \
            -e MOZ_DISABLE_GMP_SANDBOX=1 \
            --network host \
            -w /workspace \
            debian:bookworm-slim \
            bash -c "
              set -e
              
              # Install system dependencies
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                curl ca-certificates bash file \
                libgtk-3-0 libdbus-glib-1-2 libxt6 libx11-xcb1 \
                libasound2 libpulse0 libgl1 libglib2.0-0 \
                fonts-liberation xdg-utils \
                libdrm2 libgbm1 libxcomposite1 libxdamage1 \
                libxrandr2 libxshmfence1 libxtst6 \
                xvfb
              
              # Install uv
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH=\"\$HOME/.local/bin:\$PATH\"
              
              # Sync uv dependencies inside container
              cd /workspace/.github/scripts/firefox-profileserver
              uv sync
              cd /workspace
              
              # Start Xvfb in background
              Xvfb :99 -screen 0 1024x768x24 &
              XVFB_PID=\$!
              sleep 3
              
              # Run profile generation
              uv run /workspace/.github/scripts/firefox-profileserver/profileserver.py \
                --source-dir /workspace \
                --binary \"$BINARY_ABS\"
              PROFILE_EXIT=\$?
              
              # Cleanup
              kill \$XVFB_PID 2>/dev/null || true
              
              exit \$PROFILE_EXIT
            "

      - name: Verify generated profile data
        shell: ruby {0}
        run: |
          ['merged.profdata', 'en-US.log'].each do |f|
            unless File.exist?(f)
              puts "ERROR: #{f} not found"
              exit 1
            end
          end
          
          if File.zero?('merged.profdata')
            puts "ERROR: merged.profdata is empty"
            exit 1
          end
          
          puts "✓ Profile data validation successful"

      - name: Upload profile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UPLOAD_ARTIFACT_NAME }}
          path: |
            merged.profdata
            en-US.log
          retention-days: 7

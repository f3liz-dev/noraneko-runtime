---
# SPDX-License-Identifier: MPL-2.0

name: F3liz Bot Per File Patches

'on':
  issue_comment:
    types: [created]

jobs:
  f3liz-bot-per-file:
    name: Generate per-file patches for PR
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@f3liz-bot patch')) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.body, '@f3liz-bot patch'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Get PR information
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUMBER=${{ github.event.issue.number }}
            PR_INFO=$(gh pr view $PR_NUMBER --repo ${{ github.repository }} --json headRefName,baseRefName,headRepository)
            HEAD_REF=$(echo "$PR_INFO" | jq -r .headRefName)
            BASE_REF=$(echo "$PR_INFO" | jq -r .baseRefName)
            HEAD_REPO=$(echo "$PR_INFO" | jq -r .headRepository.name)
            # Use proper fallback for head_owner - fallback to current repo owner if null
            HEAD_OWNER=$(echo "$PR_INFO" | jq -r '.headRepository.owner.login // empty')
            # If still null/empty, use the repository owner as fallback
            if [ -z "$HEAD_OWNER" ] || [ "$HEAD_OWNER" = "null" ]; then
              HEAD_OWNER="${{ github.repository_owner }}"
              echo "INFO: Using fallback repository owner: $HEAD_OWNER"
            fi
          else
            PR_NUMBER=${{ github.event.pull_request.number }}
            HEAD_REF=${{ github.event.pull_request.head.ref }}
            BASE_REF=${{ github.event.pull_request.base.ref }}
            HEAD_REPO=${{ github.event.pull_request.head.repo.name }}
            HEAD_OWNER=${{ github.event.pull_request.head.repo.owner.login }}
            # Add fallback for pull_request event as well
            if [ -z "$HEAD_OWNER" ] || [ "$HEAD_OWNER" = "null" ]; then
              HEAD_OWNER="${{ github.repository_owner }}"
              echo "INFO: Using fallback repository owner: $HEAD_OWNER"
            fi
          fi

          echo "Repository: $HEAD_OWNER/$HEAD_REPO (branch: $HEAD_REF)"

          # Final validation before setting outputs
          if [ -z "$HEAD_OWNER" ] || [ "$HEAD_OWNER" = "null" ]; then
            echo "ERROR: HEAD_OWNER is still null or empty after fallback"
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "head_ref=$HEAD_REF" >> $GITHUB_OUTPUT
          echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT
          echo "head_repo=$HEAD_REPO" >> $GITHUB_OUTPUT
          echo "head_owner=$HEAD_OWNER" >> $GITHUB_OUTPUT

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr_info.outputs.head_owner }}/${{ steps.pr_info.outputs.head_repo }}
          ref: ${{ steps.pr_info.outputs.head_ref }}
          fetch-depth: 0

      - name: Add upstream remote and fetch base
        run: |
          git remote add upstream https://github.com/${{ github.repository }}.git
          git fetch upstream ${{ steps.pr_info.outputs.base_ref }}:base_branch

      - name: Configure Git
        run: |
          git config user.name "f3liz-bot[bot]"
          git config user.email "230694705+f3liz-bot@users.noreply.github.com"

      - name: Validate bot command
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_BODY="${{ github.event.comment.body }}"
          if ! echo "$COMMENT_BODY" | grep -q '@f3liz-bot patch'; then
            echo "No valid @f3liz-bot patch command found in comment. Aborting."
            exit 1
          fi
          echo "Valid @f3liz-bot patch command found."

      - name: Get overlays to remove from bot commands
        id: list_rm_overlays
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f f3liz_rm_list.txt

          gh pr view ${{ steps.pr_info.outputs.pr_number }} \
            --repo ${{ github.repository }} \
            --json comments -q '.comments[].body' \
            | grep -E '@f3liz-bot.*patch' \
            | grep -oE 'rm=[^ ]+' \
            | sed 's/rm=//' \
            | tr ',' '\n' > f3liz_rm_list.txt || true

          gh pr view ${{ steps.pr_info.outputs.pr_number }} \
            --repo ${{ github.repository }} \
            --json body -q .body \
            | grep -E '@f3liz-bot.*patch' \
            | grep -oE 'rm=[^ ]+' \
            | sed 's/rm=//' \
            | tr ',' '\n' >> f3liz_rm_list.txt || true

          sort f3liz_rm_list.txt | uniq | grep -v '^$' > f3liz_rm_list_final.txt || touch f3liz_rm_list_final.txt
          mv f3liz_rm_list_final.txt f3liz_rm_list.txt

          echo "Overlays to remove:"
          cat f3liz_rm_list.txt || echo "None"

      - name: Remove specified overlays
        run: |
          OVERLAY_DIR=".github/overlays"
          while read ENTRY; do
            [ -z "$ENTRY" ] && continue
            # Support both slash-separated paths and dash-separated names
            OVERLAY_PATH="$OVERLAY_DIR/$ENTRY"
            if [ -f "$OVERLAY_PATH" ]; then
              rm -f "$OVERLAY_PATH"
              echo "Removed overlay: $OVERLAY_PATH"
            fi
          done < f3liz_rm_list.txt
          find "$OVERLAY_DIR" -type d -empty -delete 2>/dev/null || true

      - name: Generate per-file overlays
        run: |
          OVERLAY_DIR=".github/overlays"
          mkdir -p "$OVERLAY_DIR"
          BASE=base_branch

          git diff --name-only $BASE | \
            grep -vE '^(\.github|noraneko|browser/branding/noraneko|\.woodpecker\.ya?ml)($|/)' \
            > changed_files.txt || true

          while read file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              mkdir -p "$OVERLAY_DIR/$(dirname "$file")"
              cp "$file" "$OVERLAY_DIR/$file"
              echo "Overlay: $file"
            fi
          done < changed_files.txt

          # Record the base commit
          git rev-parse $BASE > "$OVERLAY_DIR/UPSTREAM_BASE"

      - name: Stage overlay changes
        run: |
          git add .github/overlays/

      - name: Identify new overlays
        id: new_overlays
        run: |
          echo 'overlays<<EOF' >> $GITHUB_OUTPUT
          git diff --cached --name-only --diff-filter=AM ".github/overlays/" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Revert source changes (keep only overlays)
        run: |
          BASE=base_branch

          git diff --name-only $BASE | \
            grep -vE '^(\.github|noraneko|browser/branding/noraneko|\.woodpecker\.ya?ml)($|/)' \
            > files_to_revert.txt || true

          while read file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              git checkout $BASE -- "$file"
              echo "Reverted $file to base state"
            fi
          done < files_to_revert.txt

          rm -f changed_files.txt files_to_revert.txt f3liz_rm_list.txt

      - name: Commit and push overlay files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --cached --quiet; then
            echo "No overlay changes to commit."
          else
            git commit -m "chore: f3liz-bot per file overlays (reverted source changes)"
            git push origin HEAD:${{ steps.pr_info.outputs.head_ref }}
          fi

      - name: Comment on success
        if: >-
          success() && github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@f3liz-bot patch')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.F3LIZ_BOT_TOKEN }}
          script: |
            const fs = require('fs');
            let changelog = "## F3liz Bot Overlay Update\n\n";

            try {
              const removed = fs.readFileSync('f3liz_rm_list.txt', 'utf8').trim().split('\n').filter(p => p);
              if (removed.length > 0 && removed[0] !== '') {
                changelog += "### Removed Overlays:\n";
                removed.forEach(entry => { changelog += `- ${entry}\n`; });
                changelog += "\n";
              }
            } catch (e) { }

            const overlaysRaw = `${{ steps.new_overlays.outputs.overlays }}`;
            const overlays = overlaysRaw ? overlaysRaw.trim().split('\n').filter(p => p) : [];

            if (overlays.length > 0) {
              changelog += `### Generated/Updated Overlays: ${overlays.length} files\n\n`;
              changelog += "**Note:** Source files have been reverted to base state - only overlay files are kept.\n\n";
              changelog += "### Overlay Files:\n";
              overlays.forEach(o => {
                const filepath = o.replace('.github/overlays/', '');
                changelog += `- \`${filepath}\`\n`;
              });
            } else {
              changelog += "### No new overlays were generated or updated.\n";
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: changelog
            });

      - name: Comment on failure
        if: >-
          failure() && github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@f3liz-bot patch')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.F3LIZ_BOT_TOKEN }}
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `## F3liz Bot Overlay Update Failed\n\nCheck the [workflow run](${runUrl}) for details.`
            });

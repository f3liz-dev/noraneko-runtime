---
# SPDX-License-Identifier: MPL-2.0

name: Dagger CI Build

permissions:
  contents: write

'on':
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform (linux, windows)'
        type: choice
        options:
          - linux
          - windows
        default: linux
        required: true
      arch:
        description: 'Target architecture'
        type: choice
        options:
          - x86_64
          - aarch64
        default: x86_64
        required: true
      debug:
        description: 'Enable debug build'
        required: false
        type: boolean
        default: true
      pgo:
        description: 'Enable Profile-Guided Optimization'
        required: false
        type: boolean
        default: false
      omnijar_compress:
        description: 'Omni.ja compression algorithm'
        required: false
        type: choice
        options:
          - deflate
          - zstd
          - lz4
          - none
        default: deflate
      sccache:
        description: 'Enable sccache build cache with S3'
        required: false
        type: boolean
        default: false

run-name: >-
  [Dagger] ${{ inputs.platform }}-${{ inputs.arch }}
  ${{ inputs.pgo && '[PGO]' || '' }}
  ${{ inputs.debug && 'Debug' || '' }}
  ${{ inputs.sccache && '[sccache]' || '' }}

jobs:
  build:
    name: Build ${{ inputs.platform }}-${{ inputs.arch }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: .github/ci/go.sum

      - name: Run Dagger Build
        run: |
          cd .github/ci
          go run . build \
            -platform=${{ inputs.platform }} \
            -arch=${{ inputs.arch }} \
            -debug=${{ inputs.debug }} \
            -pgo=${{ inputs.pgo }} \
            -omnijar-compress=${{ inputs.omnijar_compress }} \
            -sccache=${{ inputs.sccache }} \
            -output=../../output
        env:
          DAGGER_LOG_FORMAT: plain
          # sccache S3 configuration (secrets must be configured in repository settings)
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: noraneko-${{ inputs.platform }}-${{ inputs.arch }}-moz-artifact
          path: output/*
